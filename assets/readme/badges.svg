    </a>
    <rect x="180" y="12" width="118" height="48" rx="24" fill="#1B2130" stroke="#2E3A4F"/>
    <text x="239" y="42" text-anchor="middle" fill="#D7DEEA" font-size="15" font-weight="650">iOS 17+</text>
    <rect x="310" y="12" width="138" height="48" rx="24" fill="#1B2130" stroke="#2E3A4F"/>
    <text x="379" y="42" text-anchor="middle" fill="#D7DEEA" font-size="15" font-weight="650">watchOS 10+</text>
    <rect x="460" y="12" width="118" height="48" rx="24" fill="#1B2130" stroke="#2E3A4F"/>
    <text x="519" y="42" text-anchor="middle" fill="#D7DEEA" font-size="15" font-weight="650">SwiftUI</text>
    <rect x="590" y="12" width="128" height="48" rx="24" fill="#1B2130" stroke="#2E3A4F"/>
    <text x="654" y="42" text-anchor="middle" fill="#D7DEEA" font-size="15" font-weight="650">SwiftData</text>
    <rect x="730" y="12" width="108" height="48" rx="24" fill="#1B2130" stroke="#2E3A4F"/>
    <text x="784" y="42" text-anchor="middle" fill="#D7DEEA" font-size="15" font-weight="650">CoreML</text>
    <rect x="850" y="12" width="118" height="48" rx="24" fill="#1B2130" stroke="#2E3A4F"/>
    <text x="909" y="42" text-anchor="middle" fill="#D7DEEA" font-size="15" font-weight="650">EN / RU</text>
