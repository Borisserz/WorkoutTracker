<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-labelledby="title desc">
  <title id="title">WorkoutTracker badges</title>
  <desc id="desc">Platform and stack badges for WorkoutTracker.</desc>
  <defs>
    <linearGradient id="store" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3AA0FF"/>
      <stop offset="100%" stop-color="#2F7FE0"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
