<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">WorkoutTracker</title>
  <desc id="desc">Native iOS and watchOS gym tracker with CoreML pose tracking, CNS recovery heatmap, and an AI coach.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161C"/>
      <stop offset="55%" stop-color="#1B1F2A"/>
      <stop offset="100%" stop-color="#12151C"/>
    </linearGradient>
    <linearGradient id="quad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BB6FF"/>
      <stop offset="100%" stop-color="#2F7FE0"/>
    </linearGradient>
    <linearGradient id="cns" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3AA0FF"/>
      <stop offset="100%" stop-color="#F05138"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="40%" r="38%">
      <stop offset="0%" stop-color="#3AA0FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3AA0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="26.5" fill="none" stroke="#2A3140" stroke-width="1.5"/>

  <g transform="translate(56 48)">
    <text x="0" y="18" fill="#7F8DA3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600" letter-spacing="2.4">IOS  |  WATCHOS  |  SWIFTUI</text>
    <text x="0" y="78" fill="#F4F6FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="750">WorkoutTracker</text>
    <text x="0" y="124" fill="#A7B2C5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500">AI gym coach with live pose tracking</text>
    <text x="0" y="156" fill="#A7B2C5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500">and HealthKit CNS recovery.</text>

    <g transform="translate(0 196)">
      <rect width="118" height="36" rx="18" fill="#232A38"/>
      <text x="59" y="24" text-anchor="middle" fill="#D7DEEA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">CoreML</text>
      <rect x="128" width="108" height="36" rx="18" fill="#232A38"/>
      <text x="182" y="24" text-anchor="middle" fill="#D7DEEA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">Vision</text>
      <rect x="246" width="124" height="36" rx="18" fill="#232A38"/>
      <text x="308" y="24" text-anchor="middle" fill="#D7DEEA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">HealthKit</text>
      <rect x="380" width="110" height="36" rx="18" fill="#232A38"/>
      <text x="435" y="24" text-anchor="middle" fill="#D7DEEA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">Gemini</text>
    </g>
  </g>

  <!-- recovery card: text left, anatomy right, no overlap -->
  <g transform="translate(760 40)">
    <rect width="384" height="280" rx="24" fill="#171B24" stroke="#2C3444" stroke-width="1.5"/>

    <text x="24" y="36" fill="#8B97AB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="650" letter-spacing="1.6">MUSCLE RECOVERY</text>
    <text x="24" y="72" fill="#F4F6FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">Readiness 100%</text>

    <g transform="translate(24 96)">
      <rect width="64" height="8" rx="4" fill="#253041"/>
      <rect width="64" height="8" rx="4" fill="url(#cns)"/>
      <text x="76" y="9" fill="#7F8DA3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">CNS 82</text>
    </g>

    <!-- anatomy silhouette, right side only -->
    <g transform="translate(248 86)">
      <!-- head -->
      <ellipse cx="0" cy="0" rx="16" ry="19" fill="#2E384A"/>
      <!-- torso -->
      <path d="M-28 24 C-34 48 -30 78 -18 102 L18 102 C30 78 34 48 28 24 C16 14 -16 14 -28 24 Z" fill="#343E52"/>
      <!-- arms -->
      <path d="M-28 28 C-48 42 -52 78 -40 108 L-26 108 C-34 78 -32 48 -22 34 Z" fill="#2E384A"/>
      <path d="M28 28 C48 42 52 78 40 108 L26 108 C34 78 32 48 22 34 Z" fill="#2E384A"/>
      <!-- legs base -->
      <path d="M-16 102 L-22 168 L-6 168 L2 102 Z" fill="#2E384A"/>
      <path d="M16 102 L22 168 L6 168 L-2 102 Z" fill="#2E384A"/>
      <!-- highlighted quads -->
      <path d="M-14 108 L-18 150 L-8 150 L-2 108 Z" fill="url(#quad)"/>
      <path d="M14 108 L18 150 L8 150 L2 108 Z" fill="url(#quad)"/>
      <!-- status pill -->
      <rect x="-54" y="178" width="108" height="26" rx="13" fill="#1E3A5F"/>
      <text x="0" y="196" text-anchor="middle" fill="#7EC2FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700">Quads ready</text>
    </g>

    <g transform="translate(24 232)">
      <rect width="86" height="28" rx="14" fill="#1F2836"/>
      <text x="43" y="19" text-anchor="middle" fill="#9BB0CC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="650">HRV</text>
      <rect x="96" width="86" height="28" rx="14" fill="#1F2836"/>
      <text x="139" y="19" text-anchor="middle" fill="#9BB0CC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="650">RHR</text>
      <rect x="192" width="96" height="28" rx="14" fill="#1F2836"/>
      <text x="240" y="19" text-anchor="middle" fill="#9BB0CC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="650">Sleep</text>
    </g>
  </g>
</svg>
