appId: com.borisdev.WorkoutTracker
tags:
  - smoke
  - progress
---
# Progress chrome on a fresh install (clearState). Deep empty-overlay scroll is flaky in a11y.
- runFlow: ../helpers/launch_uitest.yaml

- tapOn: "Progress"
- extendedWaitUntil:
    visible:
      id: "wt.progress.root"
    timeout: 15000

- assertVisible: "Progress"
- assertVisible: "Trends and sports analytics"
- assertVisible: "No Active Goals"
- assertVisible: "Start your streak today"
- assertVisible: "Weekly activity"
- assertVisible: "0 workouts"
